<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <title>Owl Watcher | Greetings & Celebrations</title>
    <style>
        body { 
            font-family: 'Caveat', cursive; 
            background: #fdf6e3; 
            color: #5d4037; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            overflow-x: hidden;
        }
        .main-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: #fdf6e3;
            border-bottom: 2px solid #8d6e63;
            margin-bottom: 20px;
        }
        .nav-logo {
            font-family: 'Caveat', cursive;
            color: #5d4037;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .greeting-card {
            background: #ffffff;
            border: 3px solid #8d6e63;
            border-radius: 20px;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }
        h1 { font-size: 3rem; color: #d32f2f; margin-bottom: 10px; }
        p { font-size: 1.5rem; color: #4e342e; line-height: 1.4; }
        
        /* Party Dancing Cartoon Styling */
        .party-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }
        .dancing-cartoon {
            font-size: 4rem;
            animation: danceBounce 0.8s infinite alternate ease-in-out;
        }
        .dancing-cartoon:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dancing-cartoon:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes danceBounce {
            0% { transform: translateY(0) rotate(-10deg) scale(1); }
            100% { transform: translateY(-20px) rotate(10deg) scale(1.1); }
        }

        /* Alternative Animation Classes for Firebase configuration selection */
        .anim-spin { animation: spinAnim 2s infinite linear !important; }
        @keyframes spinAnim {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-btn {
            background: #8d6e63;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-family: 'Caveat', cursive;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 3px 3px 0px #5d4037;
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <nav class="main-nav">
        <div class="nav-logo">Owl Watcher Greetings 🦉✨</div>
    </nav>

    <canvas id="fireworksCanvas"></canvas>

    <div class="greeting-card" id="greetingCardContainer">
        <div class="party-container" id="cartoonBox">
            <span class="dancing-cartoon">🦉</span>
            <span class="dancing-cartoon">🥳</span>
            <span class="dancing-cartoon">🎉</span>
        </div>
        <h1 id="greetTitle">Happy Anniversary / Birthday!</h1>
        <p id="greetMessage">Loading special wishes from the community...</p>
        <a href="index.html" class="back-btn">⬅ Back to Portal</a>
    </div>

    <!-- Firebase SDKs (Compat or Modular based on your setup) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // TODO: Replace with your actual Firebase project configuration credentials
     const firebaseConfig = {
    databaseURL: "https://finder-owl-default-rtdb.firebaseio.com/"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Parse URL parameters to check if a specific greeting ID was passed
        const urlParams = new URLSearchParams(window.location.search);
        const greetingId = urlParams.get('id') || 'default_greeting';

        // Fetch Greetings Content and Animation Preference from Firebase Database
        async function loadGreetingData() {
            try {
                const snapshot = await db.ref('greetings/' + greetingId).once('value');
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.title) document.getElementById('greetTitle').innerText = data.title;
                    if (data.message) document.getElementById('greetMessage').innerText = data.message;
                    
                    // Option to choose different animation styles via Firebase database configuration entry
                    if (data.animationStyle === 'spin') {
                        document.querySelectorAll('.dancing-cartoon').forEach(el => el.classList.add('anim-spin'));
                    }
                } else {
                    // Fallback generic display if record doesn't exist explicitly in RTDB
                    document.getElementById('greetTitle').innerText = "Warm Community Wishes!";
                    document.getElementById('greetMessage').innerText = "Wishing you a wonderful celebration filled with joy, success, and happiness from everyone at Owl Watcher!";
                }
            } catch (err) {
                console.error("Error fetching greeting from Firebase:", err);
                document.getElementById('greetMessage').innerText = "Wishing you a wonderful day filled with joy and celebration!";
            }
        }

        loadGreetingData();

        // Colorful Fireworks Animation Script
        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 6 + 2;
                this.friction = 0.95;
                this.gravity = 0.08;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }
            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let fireworks = [];
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81'];

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height / 2);
            const chosenColor = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 70; i++) {
                fireworks.push(new FireworkParticle(x, y, chosenColor));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fireworks.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.alpha <= 0) {
                    fireworks.splice(index, 1);
                }
            });
            requestAnimationFrame(animateFireworks);
        }

        // Trigger fireworks periodically
        setInterval(createFirework, 900);
        animateFireworks();
    </script>
</body>
</html>
