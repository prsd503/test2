<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <title>Owl Watcher | Greetings & Celebrations</title>
    <style>
        body { 
            font-family: 'Caveat', cursive; 
            background: radial-gradient(circle at center, #1a1c29 0%, #0d0e15 100%); 
            color: #f5f5f5; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: rgba(13, 14, 21, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 20;
        }
        .nav-logo {
            font-family: 'Caveat', cursive;
            color: #ffcc00;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .greeting-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            margin: 80px auto 20px auto;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 204, 0, 0.1);
            position: relative;
            z-index: 10;
            animation: cardFloat 4s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        h1 { 
            font-size: 3.2rem; 
            color: #ff6b81; 
            margin: 15px 0; 
            text-shadow: 0 0 15px rgba(255, 107, 129, 0.4);
        }
        p { 
            font-size: 1.6rem; 
            color: #e0e0e0; 
            line-height: 1.5; 
            margin-bottom: 30px;
        }
        
        /* Static Emoji Container (All movement removed) */
        .party-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .static-emoji {
            font-size: 3.5rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .back-btn {
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 14px;
            font-size: 1.4rem;
            font-family: 'Caveat', cursive;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <nav class="main-nav">
        <div class="nav-logo">Owl Watcher Greetings 🦉✨</div>
    </nav>

    <canvas id="fireworksCanvas"></canvas>

    <div class="greeting-card" id="greetingCardContainer">
        <div class="party-container" id="cartoonBox">
            <span class="static-emoji">🎈</span>
            <span class="static-emoji">🥳</span>
            <span class="static-emoji">🎉</span>
        </div>
        <h1 id="greetTitle">Happy Anniversary / Birthday!</h1>
        <p id="greetMessage">Loading special wishes from the community...</p>
        <a href="index.html" class="back-btn">⬅ Back to Portal</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://finder-owl-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Parse URL parameters to check if a specific greeting ID was passed
        const urlParams = new URLSearchParams(window.location.search);
        const greetingId = urlParams.get('id') || 'default_greeting';

        // Fetch Greetings Content from Firebase Database
        async function loadGreetingData() {
            try {
                const snapshot = await db.ref('greetings/' + greetingId).once('value');
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.title) document.getElementById('greetTitle').innerText = data.title;
                    if (data.message) document.getElementById('greetMessage').innerText = data.message;
                } else {
                    // Fallback generic display if record doesn't exist explicitly in RTDB
                    document.getElementById('greetTitle').innerText = "Warm Community Wishes!";
                    document.getElementById('greetMessage').innerText = "Wishing you a wonderful celebration filled with joy, success, and happiness from everyone at Owl Watcher!";
                }
            } catch (err) {
                console.error("Error fetching greeting from Firebase:", err);
                document.getElementById('greetMessage').innerText = "Wishing you a wonderful day filled with joy and celebration!";
            }
        }

        loadGreetingData();

        // Colorful Fireworks Animation Script
        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 6 + 2;
                this.friction = 0.95;
                this.gravity = 0.08;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }
            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let fireworks = [];
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81', '#00d2d3'];

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height / 2);
            const chosenColor = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 70; i++) {
                fireworks.push(new FireworkParticle(x, y, chosenColor));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fireworks.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.alpha <= 0) {
                    fireworks.splice(index, 1);
                }
            });
            requestAnimationFrame(animateFireworks);
        }

        // Trigger fireworks periodically
        setInterval(createFirework, 900);
        animateFireworks();
    </script>
</body>
</html>
